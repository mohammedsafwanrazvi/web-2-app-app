name: Build Android
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: |
          npx cap add android
          cp -rf android-overrides/. android/
          rm -f android/app/src/main/res/values/ic_launcher_background.xml

          npx cap sync android
      - name: Allow images and cookies in the app
        run: |
          sed -i '0,/<application/s//<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore android/app/release.jks -alias upload \
            -keyalg RSA -keysize 2048 -validity 9125 \
            -storepass 'Z34M@S@UFtmL4wASBxMS' -keypass 'Z34M@S@UFtmL4wASBxMS' -dname "CN=Web 2 App, O=Web 2 App, C=IN"
          keytool -list -v -keystore android/app/release.jks -alias upload -storepass 'Z34M@S@UFtmL4wASBxMS' | grep SHA256 || true
      - name: Build APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.jks \
            -Pandroid.injected.signing.store.password='Z34M@S@UFtmL4wASBxMS' \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password='Z34M@S@UFtmL4wASBxMS'
      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/Web-2-App.apk"
          cp android/app/build/outputs/bundle/release/*.aab "out/Web-2-App.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: out/*
      - name: Publish download links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Web 2 App 1.0.0
          files: out/*
